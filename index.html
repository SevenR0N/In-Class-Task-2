<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Class 2</title>
    <style>
        .grid{
             display: grid;
             grid-template-columns: repeat(3, 1fr);;
             grid-template-rows: 1fr 1fr 1fr;
             grid-gap: 5px;
        }

        .grid div{
            border: 1px solid rgb(78, 9, 64);
            border-radius: 2px;
            background-color: rgba(21, 102, 112, 0.8);
            padding: 0.2em 3em;
            color: rgb(15, 6, 6);
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div><img src="https://picsum.photos/seed/item1/400/400" alt="Gallery photo 1"></div>
        <div><img src="https://picsum.photos/seed/item2/400/400" alt="Gallery photo 2"></div>
        <div><img src="https://picsum.photos/seed/item3/400/400" alt="Gallery photo 3"></div>
        <div><img src="https://picsum.photos/seed/item4/400/400" alt="Gallery photo 4"></div>
        <div><img src="https://picsum.photos/seed/item5/400/400" alt="Gallery photo 5"></div>
        <div><img src="https://picsum.photos/seed/item6/400/400" alt="Gallery photo 6"></div>
        <div><img src="https://picsum.photos/seed/item7/400/400" alt="Gallery photo 7"></div>
        <div><img src="https://picsum.photos/seed/item8/400/400" alt="Gallery photo 8"></div>
        <div><img src="https://picsum.photos/seed/item9/400/400" alt="Gallery photo 9"></div>
    </div>
    <footer>

</body>
</html>
